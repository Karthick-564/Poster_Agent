[project]
name = "poster-agent"
version = "0.1.0"
description = "Brand-aware event poster agent: plan -> layout -> VectorCraft (native MCP) -> checks -> critic"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.14,<3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "pillow>=13.0",
    "numpy>=2.5",
    "opencv-python>=5.0",
    "rapidocr-onnxruntime>=1.4",
    "rapidfuzz>=3.14",
    "onnxruntime>=1.31",
    "rembg>=2.0.86",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["poster_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow'"  # plain `pytest -q` is the fast suite; `pytest -q -m slow` runs the VectorCraft render tests
markers = ["slow: renders through VectorCraft (run before a release or after changing the compiler/checks)"]
